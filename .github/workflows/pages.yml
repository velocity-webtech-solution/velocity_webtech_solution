name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify exported SEO files
        run: |
          test -s out/sitemap.xml
          test -s out/robots.txt
          grep -Fq 'https://www.velocitywebtechsolutions.com/' out/sitemap.xml
          grep -Fq 'Sitemap: https://www.velocitywebtechsolutions.com/sitemap.xml' out/robots.txt
          grep -Fq '<link rel="canonical" href="https://www.velocitywebtechsolutions.com/"' out/index.html
          grep -Fxq 'www.velocitywebtechsolutions.com' out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
